# CI over this repository's release source (`manifest.json`, `payload/`,
# `fixtures/`, `templates/`) and its own Workflow installation
# (docs/ai-workflow/WORKFLOW_REPOSITORY_SETUP_PLAN.md, CP2):
#
#   checks                      one job, one checkout and one install of the
#                               pinned tools, with every check its own named
#                               step. A failed step does not stop an unrelated
#                               block whose own prerequisites succeeded:
#     installation              `workflow-manager verify .`: this repository's
#                               installed Workflow is exactly the release it
#                               says it is.
#     package                   builds HEAD's package, then the pinned Workflow
#                               Manager verifies it and bootstraps and verifies
#                               a scratch repository from the staged release.
#     immutability              the release source is frozen while a version is
#                               pending, and a published version's release
#                               source and assets never change.
#     docs                      the user documentation: tools/docs/'s tests,
#                               then its checker (links, page headers, slash
#                               commands) over README.md and docs/.
#     tooling                   tools/release/'s tests, including the
#                               byte-for-byte reproduction of every published
#                               release in the pinned deflate runtime.
#     manager block             a release after 2.12.0 carries a valid `manager`
#                               block whose suite counts equal the measurement
#                               of its own conformance fixture, whose minimum
#                               Manager is published (committed evidence,
#                               offline) and is the pinned one; the committed
#                               evidence is compared with the live list (never
#                               failing on unavailability); the pre-publish
#                               update fixture bootstraps the previous release,
#                               updates to HEAD with the pinned Manager and
#                               runs the nine frozen suites (docs/RELEASING.md,
#                               "The Manager metadata block").
#   release-source-conformance  the release source's own frozen suites, in its
#                               conformance fixture: nine suites in parallel
#                               (min(4, nproc) at a time, longest first), each
#                               in its own copy of the fixture.
#   aggregate                   fails unless both jobs above succeeded. It is
#                               the required check, so adding a job here never
#                               touches the ruleset.
#
# The release source is always read from `git archive` of a commit, never
# from the working tree, which also holds the installation. Every job that
# builds a package installs the hash-pinned `zlib-ng` wheel first
# (tools/release/deflate-requirements.txt); the Manager wheel is pinned by
# version and sha256 in tools/release/manager-pin.json. A version change is
# measured from `HEAD^1`: the base branch tip on a pull request's merge ref,
# the previous `main` tip on a push. This workflow is not managed by
# workflow-manager; workflow-conformance.yml is, and stays as installed.
name: Workflow CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A pull request keeps its per-ref group, and a new push cancels its stale
# run. Every other run gets its own per-event, per-commit group and is never
# cancelled, so no `main` commit loses the run the release job waits for.
concurrency:
  group: workflow-ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# An explicit `bash` runs with `-o pipefail`, so a failing command before a
# pipe (`release.py build | tee`) fails its step.
defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Full history and tags: the reproduction tests stage v2.3.1 .. v2.6.0.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      - name: Install the pinned deflate runtime
        id: deflate
        run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r tools/release/deflate-requirements.txt
          python3 -c 'from zlib_ng import zlib_ng; print("zlib-ng", zlib_ng.ZLIBNG_RUNTIME_VERSION)'
      - name: Install the pinned Workflow Manager
        id: manager
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: |
          read -r version wheel sha256 < <(python3 -c 'import json; p = json.load(open("tools/release/manager-pin.json")); print(p["version"], p["wheel"], p["sha256"])')
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$wheel" "https://github.com/RodrigoFAbreu/workflow-manager/releases/download/v$version/$wheel"
          (cd "$RUNNER_TEMP" && echo "$sha256  $wheel" | sha256sum -c)
          python3 -m pip install "$RUNNER_TEMP/$wheel"
          workflow-manager --version

      # installation
      - name: workflow-manager verify .
        if: ${{ !cancelled() && steps.manager.outcome == 'success' }}
        run: workflow-manager verify .

      # package
      - name: Build the package
        id: build
        if: ${{ !cancelled() && steps.deflate.outcome == 'success' }}
        run: |
          python3 tools/release/release.py build --commit HEAD --out "$RUNNER_TEMP/assets" | tee "$RUNNER_TEMP/build.txt"
          python3 -c 'import sys; sys.path.insert(0, "tools/release"); import package; package.stage(".", "HEAD", sys.argv[1])' "$RUNNER_TEMP/staged"
      - name: Verify the package with the Workflow Manager
        id: verify
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.manager.outcome == 'success' }}
        run: |
          version="$(sed -n 's/^version=//p' "$RUNNER_TEMP/build.txt")"
          digest="$(sed -n 's/^archive_sha256=//p' "$RUNNER_TEMP/build.txt")"
          workflow-manager package verify "$RUNNER_TEMP/assets/workflow-$version.tar.gz" --sha256 "$digest"
      # `--release-dir` on `verify` too: without it, `verify` resolves the
      # recorded version through the Manager's pins, which refuse a version
      # the pinned Manager does not know (an unpublished bump).
      - name: Bootstrap and verify a scratch repository
        id: scratch
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.manager.outcome == 'success' }}
        run: |
          git init -q "$RUNNER_TEMP/scratch"
          workflow-manager --release-dir "$RUNNER_TEMP/staged" bootstrap "$RUNNER_TEMP/scratch"
          workflow-manager --release-dir "$RUNNER_TEMP/staged" verify "$RUNNER_TEMP/scratch"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.verify.outcome == 'success' && steps.scratch.outcome == 'success' }}
        with:
          name: package
          path: ${{ runner.temp }}/assets/
          if-no-files-found: error

      # immutability
      # A `contents: read` token does not see drafts; that is enough here,
      # since a draft never counts as a publication.
      - name: Save the release list
        id: releases
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release list --json tagName,isDraft --limit 1000 > "$RUNNER_TEMP/releases.json"
      - name: Pending release source is frozen
        if: ${{ !cancelled() && steps.releases.outcome == 'success' && steps.deflate.outcome == 'success' }}
        run: python3 tools/release/release.py check-pending --releases "$RUNNER_TEMP/releases.json"
      - name: Published release source is unchanged
        if: ${{ !cancelled() && steps.releases.outcome == 'success' && steps.deflate.outcome == 'success' }}
        run: python3 tools/release/release.py check-immutable --releases "$RUNNER_TEMP/releases.json"
      - name: Published assets are unchanged
        if: ${{ !cancelled() && steps.releases.outcome == 'success' && steps.deflate.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(git show HEAD:manifest.json | python3 -c 'import json, sys; print(json.load(sys.stdin)["workflow_version"])')"
          if ! jq -e --arg tag "v$version" 'any(.[]; .tagName == $tag and (.isDraft | not))' "$RUNNER_TEMP/releases.json" > /dev/null; then
            echo "version $version is not published; nothing to compare"
            exit 0
          fi
          gh release download "v$version" --dir "$RUNNER_TEMP/published"
          python3 tools/release/release.py check-immutable --releases "$RUNNER_TEMP/releases.json" --published "$RUNNER_TEMP/published"

      # docs
      - name: check_docs_test.py
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: python3 tools/docs/check_docs_test.py
      - name: check_docs.py
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: python3 tools/docs/check_docs.py

      # tooling
      - name: release_test.py
        if: ${{ !cancelled() && steps.deflate.outcome == 'success' }}
        run: python3 tools/release/release_test.py

      # manager block
      - name: Manager block is valid and measured
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: python3 tools/release/release.py check-manager-block --commit HEAD --manager-releases tools/release/manager-releases.json
      - name: Manager release list is current
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/release.py compare-manager-releases --manager-releases tools/release/manager-releases.json
      # Only a release that carries a block (after 2.12.0) is update-tested:
      # from the highest published release below HEAD's version, with the pinned
      # Manager (which check-manager-block holds equal to the block's minimum).
      - name: Update fixture
        if: ${{ !cancelled() && steps.releases.outcome == 'success' && steps.manager.outcome == 'success' && steps.deflate.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(python3 - "$RUNNER_TEMP/releases.json" <<'PY'
          import json, re, subprocess, sys
          head = json.loads(subprocess.check_output(["git", "show", "HEAD:manifest.json"]))
          key = lambda s: tuple(map(int, s.split(".")))
          if "manager" not in head:
              sys.exit(0)
          tags = [r["tagName"][1:] for r in json.load(open(sys.argv[1]))
                  if not r["isDraft"] and re.fullmatch(r"v\d+\.\d+\.\d+", r["tagName"])]
          below = [t for t in tags if key(t) < key(head["workflow_version"])]
          print(max(below, key=key) if below else "")
          PY
          )"
          if [ -z "$previous" ]; then
            echo "no manager block, or no earlier published release; nothing to update-test"
            exit 0
          fi
          gh release download "v$previous" --dir "$RUNNER_TEMP/previous"
          python3 tools/release/release.py update-fixture --commit HEAD --previous-assets "$RUNNER_TEMP/previous" --previous-version "$previous" --manager workflow-manager

  release-source-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stage the conformance fixture
        run: python3 tools/release/release.py stage-conformance --commit HEAD --out "$RUNNER_TEMP/fixture"
      # The same nine suites as workflow-conformance.yml, run the same way
      # (min(4, nproc) at a time, longest first), but over the staged release
      # source and never the installed scripts/. Each suite runs in its own
      # complete copy of the fixture with its own TMPDIR and HOME, always
      # runs to its end, and all results are collected before deciding.
      - name: Run the source conformance suites
        run: |
          suites="workflow_acceptance_matrix_test.py workflow_protocol_test.py workflow_state_test.py workflow_gate_policy_test.py workflow_fingerprint_generalization_test.py workflow_state_completion_obligations_test.py workflow_integration_test.py workflow_fingerprint_test.py workflow_test_harness_test.py"
          width=$(nproc); [ "$width" -gt 4 ] && width=4
          base="$RUNNER_TEMP/source-conformance"; logs="$RUNNER_TEMP/source-conformance-logs"
          rm -rf "$base" "$logs"; mkdir -p "$base" "$logs"
          run_suite() {
            d="$base/$1"; log="$logs/$1.log"; : >"$log"
            mkdir -p "$d/tmp" "$d/home"
            cp -a "$RUNNER_TEMP/fixture/." "$d/repo" >>"$log" 2>&1
            start=$SECONDS; echo "start $1"
            status=0
            (cd "$d/repo/scripts" && TMPDIR="$d/tmp" HOME="$d/home" python3 "$1" >>"$log" 2>&1) || status=$?
            echo "$status $((SECONDS - start))" >"$logs/$1.result"
            echo "done  $1 exit $status in $((SECONDS - start))s"
          }
          for s in $suites; do
            while [ "$(jobs -rp | wc -l)" -ge "$width" ]; do wait -n || true; done
            ( run_suite "$s" ) &
          done
          wait
          failed=0
          { echo "| suite | result | seconds |"; echo "| --- | --- | --- |"; } >>"$GITHUB_STEP_SUMMARY"
          for s in $suites; do
            read -r status secs <"$logs/$s.result" 2>/dev/null || { status=missing; secs=0; }
            if [ "$status" = 0 ]; then
              echo "::group::$s passed in ${secs}s"; cat "$logs/$s.log"; echo "::endgroup::"
              echo "| $s | passed | $secs |" >>"$GITHUB_STEP_SUMMARY"
            else
              failed=$((failed + 1))
              echo "::error title=$s failed::exit $status after ${secs}s"; cat "$logs/$s.log" 2>/dev/null || true
              echo "| $s | FAILED (exit $status) | $secs |" >>"$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ "$failed" -ne 0 ]; then echo "$failed suite(s) failed"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: source-conformance-logs
          path: ${{ runner.temp }}/source-conformance-logs/
          if-no-files-found: ignore

  aggregate:
    needs: [checks, release-source-conformance]
    # Always, so a failed, skipped or cancelled job fails this required check
    # rather than skipping it.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job
        env:
          CHECKS: ${{ needs.checks.result }}
          CONFORMANCE: ${{ needs.release-source-conformance.result }}
        run: |
          status=0
          for pair in "checks=$CHECKS" "release-source-conformance=$CONFORMANCE"; do
            job="${pair%%=*}" result="${pair#*=}"
            if [ "$result" != success ]; then echo "::error::the $job job concluded $result"; status=1; fi
          done
          exit "$status"
