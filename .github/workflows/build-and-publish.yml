# Publishes a Workflow release when `main`'s manifest names a version that is
# not yet published (docs/ai-workflow/WORKFLOW_REPOSITORY_SETUP_PLAN.md, CP3;
# docs/RELEASING.md, "The release job" and "GitHub Actions layout").
#
# Two ways in, one set of gates, and only ever on `refs/heads/main`:
#
#   called      by ci.yml's `build-and-publish` job (`workflow_call` with
#               `validated: true`) on a push to `main` or a dispatch of `CI`
#               on `main`, once that run's `aggregate` succeeded: the run's
#               commit (`github.sha`) was validated in the same run.
#               `github.event_name` is the caller's, `push` or
#               `workflow_dispatch`, and on a dispatch `github.event.workflow`
#               names the dispatched file, `.github/workflows/ci.yml`. If
#               `main` has meanwhile moved past that commit, the gate ends with
#               a notice and no sha: the tip's own CI run, once validated,
#               publishes it.
#   dispatched  by hand on `main` (`workflow_dispatch` of this file), the
#               re-run path. Nothing in its own run validated anything, so
#               `validated` stays false (a direct dispatch that sets it is
#               refused) and the gate takes `main`'s tip only once a `CI`
#               (ci.yml) push run for that exact commit has a successful
#               `aggregate` job (the run itself may have failed in its own
#               `build-and-publish`, which this path re-runs); otherwise it
#               fails.
#
# So "this run validated the target" is `github.event_name !=
# 'workflow_dispatch' || inputs.validated`, where a push also needs
# `validated` (only ci.yml calls this file on a push) and a validated dispatch
# must be a dispatch of ci.yml.
#
# `dry-run` (an input of every way in, default false; ci.yml passes its own
# dispatch input) runs every gate, the build, the Manager's verification and,
# for an already published version, the read-back, but never `gh release
# create`, and so never reads back a release it did not create.
#
# The `gate` job checks out nothing and runs none of this repository's code:
# the `release` job runs only with the gate's sha, checked out at that exact
# sha, so the release tooling it executes is always tooling CI passed.
# `release.py next-release` then decides, on the tip's first-parent history,
# the manifest version `V` and its introducing commit `C_V`:
#
#   state=published  `vV` already exists: build `C_V` and read `vV` back.
#                    Intact, there is nothing to release; anything else fails
#                    the run, naming what differs and the supersession
#                    procedure. A published release is never repaired.
#   state=pending    build `C_V`, verify it with the pinned Workflow Manager,
#                    publish `vV` at `C_V` and read it back.
#
# A draft or a tag without a published release is the residue of a failed
# publication: `next-release` refuses on it, naming the recovery
# (docs/RELEASING.md). This job never deletes, edits or re-uploads a release,
# never creates or pushes a tag itself, and never changes the manifest.
#
# No workflow-level concurrency: a called workflow whose group equals its
# caller's deadlocks, and the `release` job serializes every publication in
# its own group, never cancelled. The caller's `build-and-publish` job grants
# `contents: write` and `actions: read`; only the `release` job uses the
# write permission. Building and publishing only: the tests that validate the
# revision are tests.yml's, orchestrated by ci.yml.
name: Build and publish

on:
  workflow_call:
    inputs:
      validated:
        description: "Set by ci.yml: this run's aggregate validated github.sha"
        type: boolean
        default: false
      dry-run:
        description: "Run every gate and build, but do not create the release"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      validated:
        description: "Set only by ci.yml after its aggregate; a direct dispatch that sets it is refused"
        type: boolean
        default: false
      dry-run:
        description: "Run every gate and build, but do not create the release"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # A push to `main` or a `CI` dispatch on `main`, called by CI after its
  # `aggregate`, or a direct dispatch on `main`. Anything else (a pull request,
  # the nightly schedule, another branch, a push call without `validated`)
  # releases nothing.
  gate:
    if: >-
      github.ref == 'refs/heads/main'
      && ((github.event_name == 'push' && inputs.validated)
        || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      # Called (a push, or a dispatch of ci.yml, with `validated`): the tip,
      # read afresh, is released only when it is the commit this run
      # validated; a commit `main` has since moved past ends here with no
      # `sha` (the tip's own run publishes). Dispatched directly (no
      # `validated`): the tip is released only once the API lists a `CI` push
      # run for it whose `aggregate` succeeded; without one the dispatch
      # fails. A direct dispatch that claims `validated` fails at once.
      - name: Resolve the release commit
        id: resolve
        env:
          RUN_SHA: ${{ github.sha }}
          VALIDATED: ${{ inputs.validated }}
          DISPATCHED_WORKFLOW: ${{ github.event.workflow }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::a release is published only from refs/heads/main, not $GITHUB_REF"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$VALIDATED" = true ] \
            && [ "$DISPATCHED_WORKFLOW" != .github/workflows/ci.yml ]; then
            echo "::error::validated is set only by ci.yml after its aggregate, never by a dispatch of '$DISPATCHED_WORKFLOW'"
            exit 1
          fi
          tip="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$GITHUB_EVENT_NAME" = push ] \
            || { [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$VALIDATED" = true ]; }; then
            if [ "$VALIDATED" != true ]; then
              echo "::error::a push run publishes only when CI calls it after its aggregate (validated='$VALIDATED')"
              exit 1
            fi
            if [ "$tip" != "$RUN_SHA" ]; then
              echo "::notice::main moved from $RUN_SHA to $tip; the tip's own CI run decides the release"
              exit 0
            fi
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$tip&event=push&per_page=100" --jq '.workflow_runs[].id')"
            validated=0
            for run in $runs; do
              # Anything but a run id, or a count (`null`, empty), is never read as green.
              case "$run" in
                *[!0-9]*)
                  echo "::error::unexpected CI run id '$run' for main's tip $tip"
                  exit 1
                  ;;
              esac
              count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" --jq '[.jobs[] | select(.name == "aggregate" and .conclusion == "success")] | length')"
              case "$count" in
                '' | *[!0-9]*)
                  echo "::error::unexpected aggregate count '$count' in CI run $run for main's tip $tip"
                  exit 1
                  ;;
              esac
              if [ "$count" -gt 0 ]; then validated=1; fi
            done
            if [ "$validated" -eq 0 ]; then
              echo "::error::main's tip $tip has no CI push run whose aggregate succeeded"
              exit 1
            fi
          else
            echo "::error::unexpected event $GITHUB_EVENT_NAME"
            exit 1
          fi
          echo "sha=$tip" >> "$GITHUB_OUTPUT"

  release:
    needs: gate
    if: needs.gate.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Competing runs resolve the same `V`, `C_V` and bytes; serialized, the
    # second finds `V` published and only reads it back.
    concurrency:
      group: workflow-release
      cancel-in-progress: false
    # `contents: write` publishes, and also lets the saved release list show
    # drafts, which `next-release` must see.
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # The gate's green sha, never the moving `main`: the release tooling
      # executed below is that commit's. Full history and every tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned deflate runtime
        run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r tools/release/deflate-requirements.txt
          python3 -c 'from zlib_ng import zlib_ng; print("zlib-ng", zlib_ng.ZLIBNG_RUNTIME_VERSION)'
      - name: Save the release list
        run: gh release list --json tagName,isDraft --limit 1000 > "$RUNNER_TEMP/releases.json"
      - name: Decide what to release
        id: decide
        env:
          TRIGGER: ${{ needs.gate.outputs.sha }}
        run: python3 tools/release/release.py next-release --trigger "$TRIGGER" --releases "$RUNNER_TEMP/releases.json" | tee -a "$GITHUB_OUTPUT"
      - name: Build the package
        env:
          VERSION: ${{ steps.decide.outputs.version }}
          TARGET: ${{ steps.decide.outputs.target }}
        run: |
          python3 tools/release/release.py build --commit "$TARGET" --out "$RUNNER_TEMP/assets" | tee "$RUNNER_TEMP/build.txt"
          built="$(sed -n 's/^version=//p' "$RUNNER_TEMP/build.txt")"
          if [ "$built" != "$VERSION" ]; then
            echo "::error::$TARGET builds version $built, not $VERSION"
            exit 1
          fi

      # state=pending: verify, publish, read back.
      - name: Install the pinned Workflow Manager
        if: steps.decide.outputs.state == 'pending'
        run: |
          read -r version wheel sha256 < <(python3 -c 'import json; p = json.load(open("tools/release/manager-pin.json")); print(p["version"], p["wheel"], p["sha256"])')
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$wheel" "https://github.com/RodrigoFAbreu/workflow-manager/releases/download/v$version/$wheel"
          (cd "$RUNNER_TEMP" && echo "$sha256  $wheel" | sha256sum -c)
          python3 -m pip install "$RUNNER_TEMP/$wheel"
          workflow-manager --version
      - name: Verify the package with the Workflow Manager
        if: steps.decide.outputs.state == 'pending'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
          TARGET: ${{ steps.decide.outputs.target }}
        run: |
          digest="$(sed -n 's/^archive_sha256=//p' "$RUNNER_TEMP/build.txt")"
          workflow-manager package verify "$RUNNER_TEMP/assets/workflow-$VERSION.tar.gz" --sha256 "$digest"
          python3 -c 'import sys; sys.path.insert(0, "tools/release"); import package; package.stage(".", sys.argv[1], sys.argv[2])' "$TARGET" "$RUNNER_TEMP/staged"
          git init -q "$RUNNER_TEMP/scratch"
          workflow-manager --release-dir "$RUNNER_TEMP/staged" bootstrap "$RUNNER_TEMP/scratch"
          workflow-manager --release-dir "$RUNNER_TEMP/staged" verify "$RUNNER_TEMP/scratch"
      # Not atomic: `gh release create` makes a draft, uploads and publishes.
      # A failure inside it can leave a draft and a tag, which the next run's
      # `next-release` refuses on (docs/RELEASING.md); it is never retried
      # here. A dry run skips it, and only it.
      - name: Publish
        if: steps.decide.outputs.state == 'pending' && !inputs.dry-run
        env:
          VERSION: ${{ steps.decide.outputs.version }}
          TARGET: ${{ steps.decide.outputs.target }}
        run: |
          gh release create "v$VERSION" --target "$TARGET" --title "Workflow $VERSION" \
            --notes "Workflow release $VERSION." --latest \
            "$RUNNER_TEMP/assets/workflow-$VERSION.tar.gz" \
            "$RUNNER_TEMP/assets/workflow-$VERSION.manifest.json" \
            "$RUNNER_TEMP/assets/SHA256SUMS"
      - name: Skip publishing (dry run)
        if: steps.decide.outputs.state == 'pending' && inputs.dry-run
        env:
          VERSION: ${{ steps.decide.outputs.version }}
          TARGET: ${{ steps.decide.outputs.target }}
        run: |
          echo "::notice::dry run: v$VERSION would be published at $TARGET; the release is not created"

      # Both states: read `vV` back. After publishing, the release list and
      # the tags are read afresh. A dry run reads back only a version that is
      # already published: it created nothing to read.
      - name: Read the release back
        if: steps.decide.outputs.state == 'published' || !inputs.dry-run
        env:
          VERSION: ${{ steps.decide.outputs.version }}
          TARGET: ${{ steps.decide.outputs.target }}
          STATE: ${{ steps.decide.outputs.state }}
        run: |
          git fetch --quiet --force origin "refs/tags/v${VERSION}:refs/tags/v${VERSION}"
          gh release list --json tagName,isDraft --limit 1000 > "$RUNNER_TEMP/releases-after.json"
          gh release download "v$VERSION" --dir "$RUNNER_TEMP/downloaded"
          python3 tools/release/release.py check-published --version "$VERSION" --target "$TARGET" \
            --releases "$RUNNER_TEMP/releases-after.json" --assets "$RUNNER_TEMP/assets" \
            --downloaded "$RUNNER_TEMP/downloaded"
          if [ "$STATE" = published ]; then
            echo "::notice::nothing to release (v$VERSION read back intact)"
          else
            echo "::notice::published v$VERSION at $TARGET"
          fi
